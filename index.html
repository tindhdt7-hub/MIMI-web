<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIMI</title>

  <style>
    body {
      margin: 0;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mimi {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 8px;
    }

    .status {
      color: #00e5ff;
      margin-bottom: 30px;
    }

    .screen {
      border: 1px solid #00e5ff;
      border-radius: 20px;
      padding: 30px;
      min-height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0,229,255,0.2);
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: 1px solid #00e5ff;
      border-radius: 30px;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
      color: black;
    }

    button:disabled {
      opacity: 0.5;
    }

    .listening {
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <div class="mimi">

    <h1>MIMI</h1>

    <div class="status" id="status">
      AI CORE • ONLINE
    </div>

    <div class="screen" id="screen">
      Xin chào 👋<br>
      Mình là MIMI.
    </div>

    <button id="talkButton">
      🎙️ TALK TO MIMI
    </button>

  </div>

<script>

const AI_CORE_URL =
  "https://mimi-ai-core.tindhdt7.workers.dev/";

const screen = document.getElementById("screen");
const status = document.getElementById("status");
const talkButton = document.getElementById("talkButton");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;


/* =========================
   AI CORE
========================= */

async function askMimi(message) {

  status.innerHTML = "🤖 MIMI ĐANG SUY NGHĨ";

  try {

    const response = await fetch(AI_CORE_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    console.log("MIMI AI CORE:", data);

    if (!response.ok) {
      throw new Error(
        data.error || "AI Core error"
      );
    }

    const reply =
      data.reply ||
      data.response ||
      data.message ||
      "MIMI chưa có câu trả lời.";

    screen.innerHTML =
      "<b>MIMI:</b><br>" +
      escapeHtml(reply);

    status.innerHTML =
      "AI CORE • ONLINE";

    speakMimi(reply);

  } catch (error) {

    console.error("MIMI CORE ERROR:", error);

    screen.innerHTML =
      "MIMI không kết nối được AI Core.<br><br>" +
error.message;

    status.innerHTML =
      "AI CORE • ERROR";
  }
}


/* =========================
   TEXT TO SPEECH
========================= */

function speakMimi(text) {

  if (!("speechSynthesis" in window)) {

    console.log(
      "Thiết bị không hỗ trợ Speech Synthesis."
    );

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "vi-VN";
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  utterance.onstart = function() {

    status.innerHTML =
      "🔊 MIMI ĐANG NÓI";
  };

  utterance.onend = function() {

    status.innerHTML =
      "AI CORE • ONLINE";
  };

  utterance.onerror = function(event) {

    console.error(
      "TTS ERROR:",
      event
    );

    status.innerHTML =
      "🔊 TTS • ERROR";
  };

  window.speechSynthesis.speak(
    utterance
  );
}


/* =========================
   SPEECH RECOGNITION
========================= */

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "vi-VN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart = function() {

    status.innerHTML =
      "🎧 MIMI ĐANG NGHE";

    status.classList.add(
      "listening"
    );

    screen.innerHTML =
      "MIMI đang lắng nghe...<br>🎙️";

    talkButton.innerHTML =
      "🔴 ĐANG NGHE";
  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    console.log(
      "USER:",
      text
    );

    screen.innerHTML =
      "<b>Cậu:</b><br>" +
      escapeHtml(text);

    status.innerHTML =
      "AI CORE • ĐANG XỬ LÝ";

    talkButton.innerHTML =
      "🤖 MIMI ĐANG XỬ LÝ";

    talkButton.disabled =
      true;

    askMimi(text).finally(() => {

      talkButton.disabled =
        false;

      talkButton.innerHTML =
        "🎙️ TALK TO MIMI";
    });
  };


  recognition.onerror =
    function(event) {

      console.error(
        "MIC ERROR:",
        event.error
      );

      screen.innerHTML =
        "MIMI không nghe được.<br><br>" +
        "Lỗi: " +
        event.error;

      status.innerHTML =
        "MICROPHONE • ERROR";

      talkButton.innerHTML =
        "🎙️ THỬ LẠI";
    };


  recognition.onend =
    function() {

      status.classList.remove(
        "listening"
      );

      if (
        !talkButton.disabled
      ) {

        talkButton.innerHTML =
          "🎙️ TALK TO MIMI";
      }
    };

} else {

  screen.innerHTML =
    "Trình duyệt này chưa hỗ trợ " +
    "Speech Recognition.";

  status.innerHTML =
    "MICROPHONE • NOT SUPPORTED";

  talkButton.disabled =
    true;
}


/* =========================
   START LISTENING
========================= */

function startListening() {

  if (!recognition) {

    alert(
"Thiết bị chưa hỗ trợ Speech Recognition."
    );

    return;
  }

  try {

    screen.innerHTML =
      "MIMI chuẩn bị nghe...";

    recognition.start();

  } catch (error) {

    console.error(
      "START MIC ERROR:",
      error
    );
  }
}


talkButton.addEventListener(
  "click",
  startListening
);


/* =========================
   SAFE HTML
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}

</script>

</body>
</html>
