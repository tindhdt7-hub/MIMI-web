<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIMI</title>

  <style>
    body {
      margin: 0;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mimi {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 8px;
    }

    .status {
      color: #00e5ff;
      margin-bottom: 30px;
    }

    .screen {
      border: 1px solid #00e5ff;
      border-radius: 20px;
      padding: 30px;
      min-height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0,229,255,0.2);
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: 1px solid #00e5ff;
      border-radius: 30px;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
      color: black;
    }

    .listening {
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <div class="mimi">

    <h1>MIMI</h1>

    <div class="status" id="status">
      AI CORE • ONLINE
    </div>

    <div class="screen" id="screen">
      Xin chào 👋<br>
      Mình là MIMI.
    </div>

    <button id="talkButton" onclick="startListening()">
      🎙️ TALK TO MIMI
    </button>

  </div>

  <script>

    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const talkButton = document.getElementById("talkButton");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;

    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "vi-VN";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {

        status.innerHTML = "🎧 MIMI ĐANG NGHE";

        status.classList.add("listening");

        screen.innerHTML =
          "MIMI đang lắng nghe...<br>🎙️";

        talkButton.innerHTML =
          "🔴 ĐANG NGHE";
      };

      recognition.onresult = function(event) {

        const text =
          event.results[0][0].transcript;

        screen.innerHTML =
          "<b>Cậu:</b><br>" + text;

        status.innerHTML =
          "AI CORE • ĐÃ NHẬN GIỌNG NÓI";

        talkButton.innerHTML =
          "🎙️ TALK TO MIMI";
      };

      recognition.onerror = function(event) {

        screen.innerHTML =
          "MIMI không nghe được.<br><br>" +
          "Lỗi: " + event.error;

        status.innerHTML =
          "MICROPHONE • ERROR";

        talkButton.innerHTML =

"🎙️ THỬ LẠI";
      };

      recognition.onend = function() {

        status.classList.remove("listening");

        talkButton.innerHTML =
          "🎙️ TALK TO MIMI";
      };

    } else {

      screen.innerHTML =
        "Trình duyệt này chưa hỗ trợ<br>" +
        "Speech Recognition.";

      talkButton.disabled = true;
    }


    function startListening() {

      if (!recognition) return;

      screen.innerHTML =
        "MIMI chuẩn bị nghe...";

      recognition.start();
    }

  </script>

</body>
</html>
